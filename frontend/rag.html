<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super RAG Chatbot</title>

    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.72);
            --panel-light: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.08);
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --assistant: #1e293b;
            --user: #4338ca;
            --shadow: 0 10px 40px rgba(0,0,0,0.35);
            --radius: 18px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: Inter, Arial, sans-serif;
            background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 45%), #0f172a;
            color: var(--text);
            overflow: hidden;
        }

        body { display: flex; }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: 300px;
            background: var(--panel);
            backdrop-filter: blur(18px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 18px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px; height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: var(--shadow);
        }

        .logo h2 { margin: 0; font-size: 20px; }
        .logo p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
        .logo .back-link {
            display: inline-block;
            margin-top: 4px;
            color: #818cf8;
            font-size: 12px;
            text-decoration: none;
            font-weight: 500;
        }
        .logo .back-link:hover { color: #a5b4fc; }

        .new-chat-btn {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .new-chat-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, var(--primary-hover), #7c3aed);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .chat-list::-webkit-scrollbar,
        .chat-box::-webkit-scrollbar { width: 8px; }
        .chat-list::-webkit-scrollbar-thumb,
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .chat-item {
            background: var(--panel-light);
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s ease;
        }
        .chat-item:hover {
            border-color: rgba(99,102,241,0.4);
            background: rgba(99,102,241,0.08);
        }
        .chat-item.active {
            background: rgba(99,102,241,0.18);
            border-color: rgba(99,102,241,0.5);
        }

        .chat-name {
            flex: 1;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-chat-btn {
            border: none;
            background: rgba(239,68,68,0.15);
            color: #fca5a5;
            border-radius: 10px;
            width: 32px; height: 32px;
            cursor: pointer;
            transition: 0.2s ease;
            font-weight: bold;
        }
        .delete-chat-btn:hover { background: var(--danger); color: white; }

        /* ─── MAIN ─── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 18px;
            overflow: hidden;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
        }
        .send-btn:hover {
            background: linear-gradient(135deg, var(--primary-hover), #7c3aed);
        }
        .attach-btn { background: transparent; color: #94a3b8; }
        .attach-btn:hover { background: rgba(255,255,255,0.08); color: #c7d2fe; }

        /* ─── CHAT ─── */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
        }

        .chat-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 { margin: 0; font-size: 18px; }
        .chat-header span { color: var(--muted); font-size: 13px; }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message { display: flex; animation: fadeIn 0.2s ease; }
        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }

        .bubble {
            max-width: 75%;
            padding: 14px 16px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user .bubble {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border-bottom-right-radius: 6px;
        }
        .assistant .bubble {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.06);
            border-bottom-left-radius: 6px;
        }

        .citations {
            margin-top: 12px;
            padding: 12px 14px 13px;
            background: rgba(99,102,241,0.06);
            border: 1px solid rgba(99,102,241,0.16);
            border-radius: 14px;
        }
        .citations-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #a5b4fc;
            font-weight: 700;
        }
        .citations-head .count {
            background: rgba(99,102,241,0.22);
            color: #c7d2fe;
            border-radius: 999px;
            padding: 1px 8px;
            font-size: 11px;
            letter-spacing: 0;
        }
        .citation-item {
            display: flex;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 6px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .citation-item:last-child { margin-bottom: 0; }
        .citation-item:hover {
            background: rgba(99,102,241,0.10);
            border-color: rgba(99,102,241,0.30);
        }
        .citation-item .badge {
            flex: 0 0 auto;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
        }
        .citation-item .src-body { min-width: 0; flex: 1; }
        .citation-item .src-name {
            color: #c7d2fe;
            font-weight: 600;
            font-size: 12.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .citation-item .doc-ico { color: #818cf8; flex: 0 0 auto; }
        .citation-item .src-part {
            color: #a5b4fc;
            background: rgba(129,140,248,0.14);
            border-radius: 6px;
            padding: 0 6px;
            font-size: 10.5px;
            font-weight: 600;
        }
        .citation-item .src-snippet {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.45;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .input-area {
            padding: 16px 18px 20px;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }
        .composer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            padding: 8px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .composer.focused {
            border-color: rgba(99,102,241,0.5);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
        }
        .composer-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .composer-row input {
            flex: 1;
            border: none;
            background: transparent;
            color: white;
            padding: 10px 4px;
            outline: none;
            font-size: 15px;
        }
        .composer-row input::placeholder { color: #94a3b8; }

        .icon-btn {
            flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            width: 38px; height: 38px;
            border-radius: 11px;
            padding: 0;
        }

        .attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 2px 4px 0;
        }
        .attachments:empty { display: none; }
        .attach-chip {
            display: flex; align-items: center; gap: 8px;
            background: rgba(99,102,241,0.10);
            border: 1px solid rgba(99,102,241,0.22);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12.5px;
            color: #c7d2fe;
        }
        .attach-chip .chip-ico { flex: 0 0 auto; opacity: .85; }
        .attach-chip .chip-name {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 160px;
        }
        .attach-chip .chip-status { color: #94a3b8; font-size: 11px; }
        .attach-chip .chip-remove {
            border: none;
            background: transparent;
            color: inherit;
            opacity: 0.55;
            cursor: pointer;
            width: 16px; height: 16px;
            border-radius: 6px;
            padding: 0;
            margin-left: 2px;
            font-size: 15px;
            line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .attach-chip .chip-remove:hover { opacity: 1; background: rgba(255,255,255,0.12); }
        .attach-chip.done { border-color: rgba(16,185,129,0.30); background: rgba(16,185,129,0.10); color: #6ee7b7; }
        .attach-chip.done .chip-status { color: #6ee7b7; }
        .attach-chip.error { border-color: rgba(239,68,68,0.30); background: rgba(239,68,68,0.10); color: #fca5a5; }
        .attach-chip.error .chip-status { color: #fca5a5; }
        .spin { animation: spin 0.8s linear infinite; transform-origin: center; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 500;
            background: rgba(16,185,129,0.12);
            color: #6ee7b7;
            border: 1px solid rgba(16,185,129,0.2);
            margin-left: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 260px; border-right: none; border-bottom: 1px solid var(--border); }
            .bubble { max-width: 92%; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">R</div>
            <div>
                <h2>Super RAG</h2>
                <p>Multi-agent document assistant</p>
                <a href="/" class="back-link">&larr; Back to Home</a>
            </div>
        </div>

        <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <h3>Conversation <span class="status-badge" id="modeBadge">Agentic RAG</span></h3>
                    <span>5-agent orchestration &middot; Hybrid search &middot; Semantic cache</span>
                </div>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="message assistant">
                    <div class="bubble">
                        Select a chat or create a new one.
                        Upload documents and start asking questions.
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="composer" id="composer">
                    <div class="attachments" id="attachments"></div>
                    <div class="composer-row">
                        <button class="icon-btn attach-btn" id="attachBtn" type="button" title="Attach documents" aria-label="Attach documents">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <input type="text" id="questionInput" placeholder="Ask a question about your documents..." />
                        <button class="icon-btn send-btn" id="sendBtn" type="button" title="Send" aria-label="Send">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                        </button>
                    </div>
                    <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt" hidden />
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = null;

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function loadChats() {
            try {
                const res = await fetch('/chats');
                const chats = await res.json();
                const container = document.getElementById('chatList');
                container.innerHTML = '';

                for (let chat of chats) {
                    const div = document.createElement('div');
                    div.className = 'chat-item' + (currentChatId === chat.chat_id ? ' active' : '');
                    div.dataset.chatId = chat.chat_id;

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'chat-name';
                    nameSpan.textContent = chat.name;
                    nameSpan.addEventListener('click', (e) => {
                        e.stopPropagation();
                        switchChat(chat.chat_id);
                    });

                    const delBtn = document.createElement('button');
                    delBtn.textContent = '\u00d7';
                    delBtn.className = 'delete-chat-btn';
                    delBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (confirm('Delete this chat? All documents and history will be lost.')) {
                            await fetch(`/chats/${chat.chat_id}`, { method: 'DELETE' });
                            if (currentChatId === chat.chat_id) currentChatId = null;
                            await loadChats();
                            if (currentChatId === null) {
                                const remaining = await (await fetch('/chats')).json();
                                if (remaining.length > 0) {
                                    switchChat(remaining[0].chat_id);
                                } else {
                                    await createNewChat();
                                }
                            }
                        }
                    });

                    div.appendChild(nameSpan);
                    div.appendChild(delBtn);
                    container.appendChild(div);
                }

                if (!currentChatId && chats.length > 0) {
                    await switchChat(chats[0].chat_id);
                } else if (chats.length === 0) {
                    await createNewChat();
                }
            } catch (err) {
                console.error('loadChats error:', err);
            }
        }

        async function createNewChat() {
            const name = prompt('Enter chat name:', 'New Chat');
            if (!name) return;
            const formData = new FormData();
            formData.append('name', name);
            const res = await fetch('/chats/new', { method: 'POST', body: formData });
            const data = await res.json();
            await loadChats();
            await switchChat(data.chat_id);
        }

        async function switchChat(chatId) {
            if (currentChatId === chatId) return;
            currentChatId = chatId;
            clearAttachments();
            await loadChats();
            await loadChatHistory();
        }

        async function loadChatHistory() {
            if (!currentChatId) {
                document.getElementById('chatBox').innerHTML = `
                    <div class="message assistant">
                        <div class="bubble">No chat selected. Create or select a chat.</div>
                    </div>`;
                return;
            }
            try {
                const res = await fetch(`/chats/${currentChatId}/history`);
                const data = await res.json();
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML = '';
                for (let msg of data.history) {
                    addMessage(msg.role, msg.content);
                }
                if (data.history.length === 0) {
                    addMessage('assistant', 'No conversation yet. Upload documents and ask a question.');
                }
            } catch (err) {
                console.error('loadChatHistory error:', err);
            }
        }

        const CHIP_FILE_ICO = '<svg class="chip-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
        const CHIP_SPIN = '<svg class="spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';

        function clearAttachments() {
            const c = document.getElementById('attachments');
            if (c) c.innerHTML = '';
        }

        async function removeDoc(name, chip) {
            chip.remove();
            if (!currentChatId) return;
            try {
                await fetch(`/chats/${currentChatId}/documents?source=${encodeURIComponent(name)}`, { method: 'DELETE' });
            } catch (err) {
                // non-fatal: the card is already gone from the UI
            }
        }

        async function handleFiles() {
            const input = document.getElementById('fileInput');
            const files = Array.from(input.files || []);
            if (files.length === 0) return;
            if (!currentChatId) { alert('Please select or create a chat first.'); input.value = ''; return; }

            const container = document.getElementById('attachments');
            const chips = files.map(f => {
                const chip = document.createElement('div');
                chip.className = 'attach-chip';
                chip.innerHTML = CHIP_FILE_ICO +
                    '<span class="chip-name">' + escapeHtml(f.name) + '</span>' +
                    '<span class="chip-status">' + CHIP_SPIN + '</span>' +
                    '<button class="chip-remove" type="button" title="Remove document" aria-label="Remove document">×</button>';
                chip.querySelector('.chip-remove').addEventListener('click', () => removeDoc(f.name, chip));
                container.appendChild(chip);
                return chip;
            });

            const formData = new FormData();
            for (let f of files) formData.append('files', f);

            try {
                const res = await fetch(`/chats/${currentChatId}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    const byName = {};
                    (data.files || []).forEach(x => { byName[x.filename] = x.chunks; });
                    chips.forEach((chip, i) => {
                        chip.classList.add('done');
                        const n = byName[files[i].name];
                        chip.querySelector('.chip-status').textContent = (n != null ? n + ' chunks' : 'added');
                    });
                } else {
                    chips.forEach(chip => {
                        chip.classList.add('error');
                        chip.querySelector('.chip-status').textContent = 'failed';
                    });
                    addMessage('assistant', 'Upload error: ' + (data.detail || 'Unknown error'));
                }
            } catch (err) {
                chips.forEach(chip => {
                    chip.classList.add('error');
                    chip.querySelector('.chip-status').textContent = 'failed';
                });
            } finally {
                input.value = '';
            }
        }

        async function askQuestion() {
            if (!currentChatId) { alert('Please select or create a chat first.'); return; }
            const questionInput = document.getElementById('questionInput');
            const question = questionInput.value.trim();
            if (!question) return;

            addMessage('user', question);
            questionInput.value = '';
            clearAttachments();

            const formData = new FormData();
            formData.append('question', question);

            try {
                const res = await fetch(`/chats/${currentChatId}/chat`, { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    addMessage('assistant', data.answer, data.citations || []);
                } else {
                    addMessage('assistant', 'Error: ' + (data.detail || 'Unknown error'));
                }
            } catch (err) {
                addMessage('assistant', 'Request failed: ' + err.message);
            }
        }

        function addMessage(role, content, citations) {
            const chatBox = document.getElementById('chatBox');
            const wrapper = document.createElement('div');
            wrapper.className = 'message ' + role;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            let html = '<strong>' + (role === 'user' ? 'You' : 'Assistant') + '</strong><br>' + escapeHtml(content);

            if (role === 'assistant' && citations && citations.length > 0) {
                // Collapse multiple chunks of the same file into a single source entry —
                // one card per document, not one per passage.
                const groups = [];
                const bySource = {};
                for (let c of citations) {
                    if (!(c.source in bySource)) {
                        bySource[c.source] = { source: c.source, parts: [], snippet: (c.snippet || '').trim() };
                        groups.push(bySource[c.source]);
                    }
                    if (typeof c.chunk_index === 'number') bySource[c.source].parts.push(c.chunk_index + 1);
                    if (!bySource[c.source].snippet && c.snippet) bySource[c.source].snippet = c.snippet.trim();
                }
                if (groups.length > 0) {
                    const docIcon = '<svg class="doc-ico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
                    html += '<div class="citations"><div class="citations-head">Sources <span class="count">' + groups.length + '</span></div>';
                    let idx = 0;
                    for (let g of groups) {
                        idx++;
                        const n = g.parts.length;
                        const partLabel = n > 1 ? (n + ' passages') : (n === 1 ? 'part ' + g.parts[0] : '');
                        const part = partLabel ? '<span class="src-part">' + partLabel + '</span>' : '';
                        html += '<div class="citation-item">' +
                            '<span class="badge">' + idx + '</span>' +
                            '<span class="src-body">' +
                                '<span class="src-name">' + docIcon + escapeHtml(g.source) + part + '</span>' +
                                (g.snippet ? '<span class="src-snippet">' + escapeHtml(g.snippet) + '</span>' : '') +
                            '</span>' +
                        '</div>';
                    }
                    html += '</div>';
                }
            }

            bubble.innerHTML = html;
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('newChatBtn').addEventListener('click', createNewChat);
            document.getElementById('sendBtn').addEventListener('click', askQuestion);
            document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('fileInput').click());
            document.getElementById('fileInput').addEventListener('change', handleFiles);

            const qi = document.getElementById('questionInput');
            qi.addEventListener('keypress', (e) => { if (e.key === 'Enter') askQuestion(); });
            const composer = document.getElementById('composer');
            qi.addEventListener('focus', () => composer.classList.add('focused'));
            qi.addEventListener('blur', () => composer.classList.remove('focused'));

            loadChats();
        });
    </script>
</body>
</html>
