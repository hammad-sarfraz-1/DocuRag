<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents · DocuRag</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #FAF9F5;
            --raised: #FFFFFF;
            --text: #1F1E1D;
            --muted: #76756F;
            --faint: #9A988F;
            --border: #E7E4DA;
            --border-strong: #D9D6CA;
            --accent: #D97757;
            --accent-hover: #C2603F;
            --accent-soft: rgba(217,119,87,0.12);
            --hover: rgba(0,0,0,0.045);
            --danger: #B0413B;
            --danger-soft: rgba(176,65,59,0.10);
            --good: #4F7A65;
            --font-sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        nav {
            position: sticky; top: 0;
            display: flex; justify-content: center;
            background: rgba(250,249,245,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        .nav-inner { width: 100%; max-width: 720px; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; }
        .brand { display: flex; align-items: center; gap: 9px; }
        .brand-name { font-family: var(--font-serif); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; color: var(--text); }
        .nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; margin-left: 22px; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text); }

        .container { max-width: 720px; margin: 0 auto; padding: 48px 24px 60px; }

        h1 { font-family: var(--font-serif); font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; }
        .lede { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 32px; }

        /* ─── DROPZONE ─── */
        .dropzone {
            border: 1.5px dashed var(--border-strong);
            border-radius: 16px;
            background: var(--raised);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s ease;
        }
        .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
        .dropzone .ico {
            width: 48px; height: 48px; margin: 0 auto 14px;
            border-radius: 12px; background: var(--accent-soft); color: var(--accent);
            display: flex; align-items: center; justify-content: center;
        }
        .dropzone .primary { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .dropzone .secondary { font-size: 13px; color: var(--faint); }
        .dropzone .secondary b { color: var(--muted); }

        /* ─── UPLOAD QUEUE ─── */
        .queue { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
        .queue-item {
            display: flex; align-items: center; gap: 12px;
            background: var(--raised); border: 1px solid var(--border-strong);
            border-radius: 12px; padding: 10px 13px;
        }
        .queue-item.error { border-color: rgba(176,65,59,0.35); background: var(--danger-soft); }
        .queue-item.done { border-color: rgba(79,122,101,0.3); }
        .q-ico { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
        .q-meta { flex: 1; min-width: 0; }
        .q-name { font-weight: 600; font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .q-sub { font-size: 12px; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 6px; }
        .queue-item.error .q-sub { color: var(--danger); }
        .queue-item.done .q-sub { color: var(--good); }

        .spin { animation: rotate 0.8s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }

        /* ─── RECENT DOCUMENTS ─── */
        .section-label {
            font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
            color: var(--faint); margin: 40px 0 12px;
        }
        .doc-list { display: flex; flex-direction: column; gap: 8px; }
        .doc-item {
            display: flex; align-items: center; gap: 12px;
            background: var(--raised); border: 1px solid var(--border);
            border-radius: 12px; padding: 11px 14px;
            text-decoration: none;
            transition: 0.12s ease;
        }
        .doc-item:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .doc-ico { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
        .doc-meta { flex: 1; min-width: 0; }
        .doc-name { font-weight: 600; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .doc-date { font-size: 12px; color: var(--faint); margin-top: 1px; }

        .empty-state { text-align: center; padding: 28px 0; color: var(--faint); font-size: 13.5px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-inner">
            <div class="brand">
                <svg width="20" height="20" viewBox="0 0 32 32" stroke="#D97757" stroke-width="3.1" stroke-linecap="round">
                    <line x1="16" y1="4" x2="16" y2="28"/>
                    <line x1="4" y1="16" x2="28" y2="16"/>
                    <line x1="7.5" y1="7.5" x2="24.5" y2="24.5"/>
                    <line x1="24.5" y1="7.5" x2="7.5" y2="24.5"/>
                </svg>
                <span class="brand-name">DocuRag</span>
            </div>
            <div class="nav-links">
                <a href="/rag">RAG Chatbot</a>
                <a href="/architecture">Architecture</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Documents</h1>
        <p class="lede">Upload documents to the shared store — every chat can retrieve from them immediately.</p>

        <div class="dropzone" id="dropzone">
            <div class="ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="primary">Click to upload, or drag a file here</div>
            <div class="secondary"><b>.pdf</b>, <b>.docx</b>, <b>.xlsx</b>, <b>.txt</b></div>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.txt" multiple hidden />

        <div class="queue" id="queue"></div>

        <div class="section-label">Recently uploaded</div>
        <div class="doc-list" id="docList"></div>
    </div>

    <script>
        const FILE_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
        const SPIN_SVG = '<svg class="spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';

        function escapeHtml(s) {
            return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
                   ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        }

        async function loadRecentDocuments() {
            const list = document.getElementById('docList');
            try {
                const res = await fetch('/api/documents/recent?limit=8');
                const data = await res.json();
                const docs = data.documents || [];
                if (docs.length === 0) {
                    list.innerHTML = '<div class="empty-state">No documents uploaded yet.</div>';
                    return;
                }
                list.innerHTML = docs.map(d =>
                    '<a class="doc-item" href="/documents/' + encodeURIComponent(d.source) + '" target="_blank" rel="noopener noreferrer">' +
                        '<div class="doc-ico">' + FILE_SVG + '</div>' +
                        '<div class="doc-meta">' +
                            '<div class="doc-name">' + escapeHtml(d.source) + '</div>' +
                            '<div class="doc-date">' + formatDate(d.upload_date) + '</div>' +
                        '</div>' +
                    '</a>'
                ).join('');
            } catch (err) {
                list.innerHTML = '<div class="empty-state">Could not load documents.</div>';
            }
        }

        function queueCard(name) {
            const queue = document.getElementById('queue');
            const item = document.createElement('div');
            item.className = 'queue-item';
            item.innerHTML =
                '<div class="q-ico">' + FILE_SVG + '</div>' +
                '<div class="q-meta">' +
                    '<div class="q-name">' + escapeHtml(name) + '</div>' +
                    '<div class="q-sub">' + SPIN_SVG + ' Uploading…</div>' +
                '</div>';
            queue.prepend(item);
            return item;
        }

        async function uploadFiles(fileList) {
            const files = Array.from(fileList || []);
            if (files.length === 0) return;

            const ALLOWED_EXTS = ['.pdf', '.docx', '.xlsx', '.txt'];
            const accepted = [];
            for (const f of files) {
                const card = queueCard(f.name);
                const name = f.name.toLowerCase();
                if (!ALLOWED_EXTS.some(ext => name.endsWith(ext))) {
                    card.classList.add('error');
                    card.querySelector('.q-sub').textContent = 'Unsupported file type';
                    continue;
                }
                accepted.push({ file: f, card });
            }
            if (accepted.length === 0) return;

            const formData = new FormData();
            accepted.forEach(a => formData.append('files', a.file));

            try {
                const res = await fetch('/api/documents/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    const byName = {};
                    (data.files || []).forEach(x => { byName[x.filename] = x.chunks; });
                    accepted.forEach(a => {
                        a.card.classList.add('done');
                        const n = byName[a.file.name];
                        a.card.querySelector('.q-sub').textContent = n != null ? n + ' chunks added' : 'Added';
                    });
                    loadRecentDocuments();
                } else {
                    accepted.forEach(a => {
                        a.card.classList.add('error');
                        a.card.querySelector('.q-sub').textContent = data.detail || 'Upload failed';
                    });
                }
            } catch (err) {
                accepted.forEach(a => {
                    a.card.classList.add('error');
                    a.card.querySelector('.q-sub').textContent = 'Upload failed';
                });
            }
        }

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => { uploadFiles(fileInput.files); fileInput.value = ''; });

        ['dragenter', 'dragover'].forEach(evt =>
            dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); })
        );
        ['dragleave', 'drop'].forEach(evt =>
            dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
        );
        dropzone.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));

        loadRecentDocuments();
    </script>
</body>
</html>
